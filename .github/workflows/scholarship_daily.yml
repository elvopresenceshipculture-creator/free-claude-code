name: Daily Scholarship Digest

on:
  schedule:
    - cron: '0 7 * * *' # Tous les jours à 7h00 UTC (8h00 heure de Paris)
  workflow_dispatch: # Permet de déclencher manuellement depuis GitHub

jobs:
  scholarship-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      - name: Run Scholarship Fetcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          uv run scholarship_fetcher.py
