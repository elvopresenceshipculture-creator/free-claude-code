name: Daily Scholarship Digest

on:
  schedule:
    - cron: '0 7 * * *' # Tous les jours à 7h00 UTC (8h00 heure de Paris)
  workflow_dispatch: # Permet de déclencher manuellement depuis GitHub

jobs:
  scholarship-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Scholarship Fetcher
        env:
          DISCORD_WEBHOOK_URL: "https://discord.com/api/webhooks/1545199218547757146/iT9rvIDH75skQ6ERpUf4LJnmPPMK4YbBKAFpqi-ix0MHjFLpjWupU-leLigEqudYHNcF"
        run: |
          python scholarship_fetcher.py
